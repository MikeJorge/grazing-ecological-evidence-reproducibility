   <g id="text_1">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(167.663281 32.395469)">Prespecify the question and protocol</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(106.260937 43.593281)">Domain, strata, supports, windows, criteria, and benchmarks</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(44.517852 108.623484)">K1 and K2: comparative soil criteria</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(47.364883 119.261406)">Carbon stock and sediment export</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(45.788477 129.899328)">Target and panel-mean uncertainty</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(294.846484 108.623484)">K3: normative no-conversion safeguard</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(298.996797 119.261406)">Actual gross conversion within fixed F</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(288.981719 129.899328)">Fixed window; event and area uncertainty</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(133.797031 191.702445)">Check validity and eligibility; derive margin intervals</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(103.011094 202.340367)">Invalid input: stop for correction. Missing/ineligible: retain reason.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(39.307688 266.890469)">V: upper bound &lt; 0</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(25.801437 278.088281)">Nonfulfillment supported</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(211.040625 266.890469)">A: lower bound ≥ 0</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(202.820312 278.088281)">Satisfaction supported</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(401.043875 266.890469)">I: otherwise</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(394.843875 278.088281)">Indeterminate</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(123.508086 334.613484)">Report the complete criterion profile and joint conclusion</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(155.279648 345.251406)">Any V → V; all required A → A; otherwise → I</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(116.287344 355.889328)">Keep current condition and temporal stock change separate</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(189.786719 425.792656)">Separate decision appraisal</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(117.503125 436.990469)">Plausible harm, urgency, feasibility, rights, responsibility</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(131.364062 448.188281)">Investigate, consider management options, or wait</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #202530" transform="translate(161.107031 459.386094)">No action is selected by A, V, or I alone</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #202530" x="373.248" y="386.699375" transform="rotate(-0 373.248 386.699375)">Evidence informs judgment</text>
   </g>
  </g>
 </g>
